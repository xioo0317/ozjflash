// OZJFLASH：直接使用 Termux 上游 app 模块(TermuxActivity / TermuxService / 会话管理 / 设置 / 功能键栏)，
// 只把包名换成 com.com.android.ozjflash，并保留内置 bootstrap。
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.termux'
    compileSdk 37
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.com.android.ozjflash'
        // targetSdk 必须 28：Android 10+ 对 targetSdk>=29 的应用禁止执行私有目录里的文件
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1.0'

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"apt-android-7\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.com.android.ozjflash"
        manifestPlaceholders.TERMUX_APP_NAME = "OZJFLASH"
        manifestPlaceholders.TERMUX_API_APP_NAME = "OZJFLASH:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "OZJFLASH:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "OZJFLASH:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "OZJFLASH:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "OZJFLASH:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "OZJFLASH:Widget"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 固定调试签名(上游自带的 testkey_untrusted.jks)，保证后续版本能覆盖安装
    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.guava:guava:24.1-jre"
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:recycler:4.6.2"

    implementation project(":terminal-view")
    implementation project(":termux-shared")

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
