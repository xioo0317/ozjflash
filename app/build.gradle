plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.com.android.ozjflash'
    compileSdk 37

    defaultConfig {
        applicationId 'com.com.android.ozjflash'
        // targetSdk 28 是刻意选择: Android 10+ 对 targetSdk>=29 的应用禁止执行私有目录里的文件,
        // Termux 类终端必须保留 28 才能 exec 解压出来的 bootstrap 二进制
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    packaging {
        jniLibs {
            // 保持 .so 原样打进 APK(含 29MB bootstrap), 不在安装时压缩
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Termux 上游终端实现(terminal-emulator 内含 libtermux.so 的 C 源码)
    implementation project(':terminal-view')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
