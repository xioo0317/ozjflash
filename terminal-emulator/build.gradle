// Termux 上游 terminal-emulator 模块(裁剪自 https://github.com/termux/termux-app)
// 纯 Java 终端仿真核心 + jni/termux.c 编译出的 libtermux.so(PTY 与子进程管理)
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.termux.emulator'
    compileSdk 37
    // 与 CI 中通过 sdkmanager 安装的 NDK 保持一致
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            ndkBuild {
                // 去掉上游的 -Werror, 避免新版 NDK 的告警直接中断构建
                cFlags "-std=c11", "-Os", "-fno-stack-protector"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.0'
}
